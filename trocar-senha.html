
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Trocar senha</title>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">
                    P
                </div>

                <h1 class="text-xl font-bold text-gray-800">
                    Painel
                </h1>
            </div>

            <span class="text-sm text-gray-500 hidden sm:block">
                Sistema de Gestão
            </span>

        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="flex-1 flex items-center justify-center px-4 pt-24 pb-12">

        <form id="formTrocarSenha"
            class="bg-white border-2 border-gray-200 w-full max-w-md p-8 rounded-2xl shadow-xl">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-3">
                Trocar senha
            </h1>

            <p class="text-gray-500 text-center text-sm mb-8">
                Para continuar, você precisa criar sua senha pessoal.
            </p>

            <!-- SENHA TEMPORÁRIA -->
            <div class="mb-5">

                <label for="senhaAtual" class="block text-gray-700 font-semibold mb-2">
                    Senha temporária
                </label>

                <input
                    type="password"
                    id="senhaAtual"
                    placeholder="Digite a senha recebida"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>

            <!-- NOVA SENHA -->
            <div class="mb-5">

                <label for="novaSenha" class="block text-gray-700 font-semibold mb-2">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="novaSenha"
                    placeholder="Digite sua nova senha"
                    minlength="8"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500">

                <p class="text-xs text-gray-500 mt-2">
                    A senha deve possuir pelo menos 8 caracteres.
                </p>

            </div>

            <!-- CONFIRMAR SENHA -->
            <div class="mb-6">

                <label for="confirmarSenha" class="block text-gray-700 font-semibold mb-2">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite novamente sua nova senha"
                    minlength="8"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500">

            </div>

            <!-- MENSAGEM -->
            <p id="mensagem" class="text-sm text-center mb-4"></p>

            <!-- BOTÃO -->
            <button
                type="submit"
                id="btnSalvar"
                class="w-full bg-blue-600 text-white py-3 rounded-lg
                font-semibold hover:bg-blue-700 transition">

                Salvar nova senha

            </button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-gray-200">

        <div class="max-w-7xl mx-auto px-6 py-5 text-center text-sm text-gray-500">
            © 2026 Painel — Todos os direitos reservados.
        </div>

    </footer>

    <!-- INTEGRAÇÃO COM BACKEND -->
    <script>

        const API_URL = "http://localhost:8081";

        const form = document.getElementById("formTrocarSenha");
        const mensagem = document.getElementById("mensagem");
        const btnSalvar = document.getElementById("btnSalvar");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const senhaAtual = document.getElementById("senhaAtual").value;
            const novaSenha = document.getElementById("novaSenha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            mensagem.textContent = "";

            // VERIFICAR TOKEN
            const token = localStorage.getItem("token");

            if (!token) {

                mensagem.textContent = "Sua sessão expirou. Faça login novamente.";
                mensagem.className = "text-sm text-center mb-4 text-red-600";

                return;
            }

            // VALIDAR TAMANHO
            if (novaSenha.length < 8) {

                mensagem.textContent = "A nova senha precisa ter pelo menos 8 caracteres.";
                mensagem.className = "text-sm text-center mb-4 text-red-600";

                return;
            }

            // CONFIRMAR SENHA
            if (novaSenha !== confirmarSenha) {

                mensagem.textContent = "As senhas não coincidem.";
                mensagem.className = "text-sm text-center mb-4 text-red-600";

                return;
            }

            btnSalvar.disabled = true;
            btnSalvar.textContent = "Salvando...";

            try {

                const resposta = await fetch(`${API_URL}/auth/trocar-senha`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        senhaAtual: senhaAtual,
                        novaSenha: novaSenha
                    })

                });

                const texto = await resposta.text();

                let dados = {};

                try {
                    dados = texto ? JSON.parse(texto) : {};
                } catch {
                    dados = {
                        message: texto
                    };
                }

                if (!resposta.ok) {

                    throw new Error(
                        dados.message ||
                        dados.mensagem ||
                        dados.error ||
                        texto ||
                        "Não foi possível alterar a senha."
                    );

                }

                if (!dados.token) {
                    throw new Error("O servidor não retornou o novo token.");
                }

                // SALVAR NOVO TOKEN
                localStorage.setItem("token", dados.token);

                // ATUALIZAR DADOS DO USUÁRIO
                localStorage.setItem("usuario", JSON.stringify(dados.usuario));

                mensagem.textContent = "Senha alterada com sucesso! Redirecionando...";
                mensagem.className = "text-sm text-center mb-4 text-green-600";

                // IR PARA O PAINEL
                window.location.assign("./usuario.html");

            } catch (erro) {

                mensagem.textContent = erro.message || "Erro ao conectar ao servidor.";
                mensagem.className = "text-sm text-center mb-4 text-red-600";

                console.error("Erro ao trocar senha:", erro);

            } finally {

                btnSalvar.disabled = false;
                btnSalvar.textContent = "Salvar nova senha";

            }

        });

    </script>

</body>
</html>
