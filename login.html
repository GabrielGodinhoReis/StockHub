
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>StockHub | Login</title>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

            <h1 class="text-xl font-bold text-black flex items-center gap-1">
                Stock
                <span class="bg-blue-600 text-white px-2 py-1 rounded-lg">
                    Hub
                </span>
            </h1>

            <span class="text-sm text-gray-500 hidden sm:block">
                Sistema de Gestão
            </span>

        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="flex-1 flex items-center justify-center px-4 pt-24 pb-12">

        <form id="formLogin"
            class="bg-white border-2 border-gray-200 w-full max-w-md p-8 rounded-2xl shadow-xl">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
                Login
            </h1>

            <!-- CPF -->
            <div class="mb-5">

                <label for="cpf" class="block text-gray-700 font-semibold mb-2">
                    CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    placeholder="Digite seu CPF"
                    maxlength="11"
                    inputmode="numeric"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500">

            </div>

            <!-- Senha -->
            <div class="mb-6">

                <label for="senha" class="block text-gray-700 font-semibold mb-2">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500">

            </div>

            <!-- Mensagem -->
            <p id="mensagem" class="text-sm text-center mb-4"></p>

            <!-- Botões -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <button
                    type="submit"
                    id="btnEntrar"
                    class="bg-blue-600 text-white py-3 rounded-lg
                    font-semibold hover:bg-blue-700 transition">

                    Entrar

                </button>

                <button
                    type="reset"
                    class="bg-gray-200 text-gray-700 py-3 rounded-lg
                    font-semibold hover:bg-gray-300 transition">

                    Limpar

                </button>

                <!-- Voltar para o início -->
                <a
                    href="./index.html"
                    class="sm:col-span-2 text-center bg-white border border-gray-300
                    text-gray-700 py-3 rounded-lg font-semibold
                    hover:bg-gray-100 transition">

                    ← Voltar para o início

                </a>

            </div>

        </form>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200">

        <div class="max-w-7xl mx-auto px-6 py-5 text-center text-sm text-gray-500">
            © 2026 StockHub — Todos os direitos reservados.
        </div>

    </footer>

    <!-- Integração com o Backend -->
    <script>

        const API_URL = "http://localhost:8081";

        const formLogin = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");
        const btnEntrar = document.getElementById("btnEntrar");

        formLogin.addEventListener("submit", async function(event) {

            event.preventDefault();

            const cpf = document.getElementById("cpf").value.trim();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "";

            btnEntrar.disabled = true;
            btnEntrar.textContent = "Entrando...";

            try {

                const resposta = await fetch(`${API_URL}/auth/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        cpf: cpf,
                        senha: senha
                    })

                });

                const texto = await resposta.text();

                let dados = {};

                try {
                    dados = texto ? JSON.parse(texto) : {};
                } catch {
                    dados = {
                        message: texto
                    };
                }

                if (!resposta.ok) {

                    throw new Error(
                        dados.message ||
                        dados.mensagem ||
                        dados.error ||
                        texto ||
                        "Não foi possível realizar o login."
                    );

                }

                if (!dados.token) {
                    throw new Error("O servidor não retornou o token de autenticação.");
                }

                // SALVAR TOKEN
                localStorage.setItem("token", dados.token);

                // SALVAR USUÁRIO
                localStorage.setItem("usuario", JSON.stringify(dados.usuario));

                mensagem.textContent = "Login realizado com sucesso!";
                mensagem.className = "text-sm text-center mb-4 text-green-600";

                console.log("Usuário autenticado:", dados.usuario);

                // VERIFICAR SE PRECISA TROCAR A SENHA
                if (dados.usuario.trocarSenhaNoPrimeiroAcesso === true) {

                    window.location.assign("./trocar-senha.html");

                } else {

                    window.location.assign("./usuario.html");

                }

            } catch (erro) {

                mensagem.textContent = erro.message || "Não foi possível conectar ao servidor.";
                mensagem.className = "text-sm text-center mb-4 text-red-600";

                console.error("Erro no login:", erro);

            } finally {

                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";

            }

        });

        // LIMPAR MENSAGEM
        formLogin.addEventListener("reset", function() {
            mensagem.textContent = "";
        });

    </script>

</body>
</html>
